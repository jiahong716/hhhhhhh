<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111a22">
  <title>FRONTIER RUN // BT-INSPIRED LOADOUT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Frontier Run">
        <span class="brand-mark" aria-hidden="true">NR</span>
        <div>
          <p class="eyebrow">FRONTIER COMMAND / SIMULATION</p>
          <h1>FRONTIER RUN <span>// TITAN LINK</span></h1>
        </div>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="statusText">SYSTEM READY</span></div>
    </header>

    <section class="hud" aria-label="遊戲資訊">
      <div class="metric">
        <span class="metric-label">DISTANCE</span>
        <strong id="score">000000</strong>
      </div>
      <div class="metric best-metric">
        <span class="metric-label">BEST RUN</span>
        <strong id="highScore">000000</strong>
      </div>
      <div class="metric kill-metric">
        <span class="metric-label">KILLS / BEST</span>
        <strong><span id="kills">000</span><small>/ <span id="highKills">000</span></small></strong>
      </div>
      <div class="metric level-metric">
        <span class="metric-label">THREAT LEVEL</span>
        <strong id="level">01</strong>
      </div>
    </section>

    <section class="game-frame" aria-label="FRONTIER RUN 遊戲區域">
      <div class="scanline" aria-hidden="true"></div>
      <canvas id="gameCanvas" width="1200" height="520" aria-label="FRONTIER RUN 遊戲畫面"></canvas>
      <div class="game-overlay" id="gameOverlay">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlayKicker">RUN PROTOCOL</span>
          <h2 id="overlayTitle">READY TO RUN?</h2>
          <p id="overlayMessage">按下 Space 或 W 跳躍，使用 X 鎖定並摧毀前方敵人。</p>
          <button class="primary-button" id="startButton" type="button"><span>START RUN</span><b>↗</b></button>
        </div>
      </div>
    </section>

    <footer class="controls">
      <div class="control-item"><kbd>SPACE</kbd><span>JUMP</span></div>
      <div class="control-item"><kbd>W</kbd><span>JUMP</span></div>
      <div class="control-item"><kbd>X</kbd><span>FIRE</span></div>
      <div class="control-item"><kbd>P</kbd><span>PAUSE</span></div>
      <div class="control-item"><kbd>R</kbd><span>RESTART</span></div>
      <div class="footer-note"><span class="signal-bars"><i></i><i></i><i></i><i></i></span> CONNECTION STABLE</div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
